; INSTALL.INI for the GeosOne DOS Installer (INSTALL.EXE, from
; https://github.com/geosone/gdi, GPL version 3)
[Setup]
Title=EUSBASPI Setup
Product=GeosOne EUSBASPI 0.1
License=LICENSE.TXT
Readme=README.TXT
DefaultDir=%BOOT%\EUSBASPI
Done=EUSBASPI is installed. Disable "USB legacy storage" for these drives in the BIOS setup if possible, then restart the computer.

[Welcome]
EUSBASPI is an ASPI manager (SCSIMGR$) for USB mass storage - sticks,
card readers, disks, CD/DVD and floppy drives - on UHCI, OHCI, EHCI and
xHCI controllers, for DOS and Windows 3.x DOS boxes.

ASPI drivers such as ASPIDISK.SYS or ASPICD.SYS give the drives DOS
drive letters.  EUSBASPI works alone or together with AHCIASPI and other
ASPI managers.

[Options]
Option=on|Load EUSBASPI.SYS in CONFIG.SYS
Option=off|Load it into upper memory (DEVICEHIGH, needs 52 KB)|HIGH
Option=off|Also xHCI controllers (USB 3.x, /X)| /X
Option=off|Hot plugging: 2 drive slots (/H)| /H
Option=on|Windows 3.x: EUSBVXD.386 in SYSTEM.INI (for OHCI/EHCI/xHCI)
Option=on|USB drives as DOS drives: ASPIDISK.SYS (if found)
Option=on|CD-ROM drive: ASPICD.SYS and MSCDEX/SHSUCDX (if found)

[Find]
ASPIDISK=ASPIDISK.SYS
ASPICD=ASPICD.SYS
CDEX=SHSUCDX.COM SHSUCDX.EXE MSCDEX.EXE

[Files]
EUSBASPI.SYS
EUSBVXD.386
ASPITEST.COM
README.TXT
LICENSE.TXT

[Config.sys]
Remove=EUSBASPI.SYS
Add=1|DEVICE%O2%=%DIR%\EUSBASPI.SYS%O3%%O4%
Remove=ASPIDISK.SYS
Add=1,6,?ASPIDISK|DEVICE%O2%=%ASPIDISK%
; ASPICD after all ASPI managers (also AHCIASPI)
Remove=/D:ASPICD0
Add=1,7,?ASPICD,?CDEX|DEVICE%O2%=%ASPICD% /D:ASPICD0

[Autoexec.bat]
Extend=1,7,?ASPICD,?CDEX|MSCDEX,SHSUCDX| /D:ASPICD0|%CDEX% /D:ASPICD0
Position=bottom

[System.ini]
Remove=EUSBVXD.386
Add=5|386Enh|device=%DIR%\EUSBVXD.386
