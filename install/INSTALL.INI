; INSTALL.INI for the GeosOne DOS Installer (INSTALL.EXE, from
; https://github.com/geosone/gdi, GPL version 3)
[Setup]
Title=EUSBASPI Setup
Product=GeosOne EUSBASPI 0.4
Id=EUSBASPI
License=1,2
License1=EUSBASPI, OpenASPI|LICENSE.TXT
License2=SHSUCDX, CDAUDIO|SHSUCD.LIC
Readme=README.TXT
; the drivers in C:\OPENASPI with AHCIASPI and OpenASPI; this installer
; and its journals in C:\OPENASPI\EUSBASPI
DefaultDir=%BOOT%\OPENASPI
SetupDir=EUSBASPI
Done=EUSBASPI is installed. Before you unplug a USB drive, run USBSYNC (DOS) or USBSYNC.EXE (Windows). Disable "USB legacy storage" in the BIOS setup if possible, then restart the computer.

[Welcome]
EUSBASPI is an ASPI manager (SCSIMGR$) for USB mass storage - sticks,
card readers, disks, CD/DVD and floppy drives - on UHCI, OHCI, EHCI and
xHCI controllers, for DOS and Windows 3.x DOS boxes.

The OpenASPI drivers come with it and give the drives DOS drive letters:
ASPIDSK.SYS (sticks, card readers, disks), ASPICDA.SYS (CD/DVD, with
SHSUCDX and digital CD audio), ASPIFDD.SYS (ZIP, LS-120) and ASPITAP.SYS
(tape). EUSBASPI works alone or together with AHCIASPI and other ASPI
managers.

[Options]
Option=on|Load EUSBASPI.SYS in CONFIG.SYS
Option=off|Load it into upper memory (DEVICEHIGH, needs 52 KB)|HIGH
Option=off|Also xHCI controllers (USB 3.x, /X)| /X
Option=off|Hot plugging: 2 drive slots (/H)| /H
Option=on|Windows 3.x: EUSBVXD.386 in SYSTEM.INI (for OHCI/EHCI/xHCI)
Option=on|Sticks, card readers and disks as DOS drives: ASPIDSK.SYS
Option=on|CD/DVD drives: ASPICDA.SYS, SHSUCDX instead of MSCDEX or NWCDEX
Option=?FDD|ZIP, LS-120, LS-240, Clik!, Jaz: ASPIFDD.SYS
Option=?TAPE|Tape drives: ASPITAP.SYS
Option=on|Add the installation directory to the PATH (USBSYNC, ASPITEST from any directory)

; with EUSBASPI already loaded (a new setup), the devices found
; preselect the options
[Detect]
FDD=ASPISCAN.COM /Q /FDD
TAPE=ASPISCAN.COM /Q /TAPE

; the CD-ROM extension: SHSUCDX of this disk comes first (MSCDEX of MS-DOS,
; NWCDEX of DR-DOS only when a distributor took SHSUCDX off the disk)
[Find]
CDEX=SHSUCDX.COM SHSUCDX.EXE MSCDEX.EXE NWCDEX.EXE

[Files]
EUSBASPI.SYS
EUSBVXD.386
USBSYNC.COM
USBSYNC.EXE
ASPITEST.COM
ASPISCAN.COM
README.TXT=EUSBASPI.TXT
LICENSE.TXT
6|ASPIDSK.SYS
7|ASPICDA.SYS
7|CDAUDIO.COM
7|SHSUCD.LIC
7|SHSUCD.TXT
8|ASPIFDD.SYS
9|ASPITAP.SYS
9|TAPECTL.COM

[Config.sys]
Remove=EUSBASPI.SYS
Add=1|DEVICE%O2%=%DIR%\EUSBASPI.SYS%O3%%O4%
; the OpenASPI drivers after all ASPI managers (also AHCIASPI); the lines
; of EUSBASPI 0.3 with Adaptec's ASPIDISK and ASPICD go
Remove=ASPIDISK.SYS
Remove=/D:ASPICD0
Remove=ASPIDSK.SYS
Remove=ASPICDA.SYS
Remove=ASPIFDD.SYS
Remove=ASPITAP.SYS
Add=1,6|DEVICE%O2%=%DIR%\ASPIDSK.SYS
Add=1,7|DEVICE%O2%=%DIR%\ASPICDA.SYS /D:ASPICDA0
Add=1,8|DEVICE%O2%=%DIR%\ASPIFDD.SYS
Add=1,9|DEVICE%O2%=%DIR%\ASPITAP.SYS

; SHSUCDX in the place of MSCDEX or NWCDEX (INSTALL /U puts them back);
; ASPICDA0 to that line, else a new one
[Autoexec.bat]
Program=1,7,?CDEX|MSCDEX,NWCDEX,SHSUCDX|%CDEX%
Extend=1,7,?CDEX|MSCDEX,NWCDEX,SHSUCDX| /D:ASPICDA0|%CDEX% /D:ASPICDA0 /A:AUTO
PathAppend=10|%DIR%
Position=bottom

[System.ini]
Remove=EUSBVXD.386
Add=5|386Enh|device=%DIR%\EUSBVXD.386
